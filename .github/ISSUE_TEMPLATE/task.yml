name: Task
description: A unit of planned work with acceptance criteria and owned files.
title: "[SN-NN] "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is **public**. Do not include real names, places, dates, photos, emails,
        phone numbers, hostnames or secrets. Use the fictional samples (Anna & Ben, Pablo Pérez,
        María-José García, Jürgen Müller, example.com).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What this task delivers and why.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in and what is explicitly out (with the task that covers it).
      value: |
        - In:
        - Out:
    validations:
      required: true
  - type: textarea
    id: key-paths
    attributes:
      label: Key paths
      description: The files and folders this task owns. Other tasks must not edit them.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Verifiable checklist. All items must be met for the PR to merge.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues that must be merged first ("None" if none).
      value: None.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Constraints, contracts with parallel tasks, links.
