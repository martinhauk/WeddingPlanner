# Deploy: promotes one commit through e2e -> test -> production (ADR 0004).
#
# - plan:        decides which environments run for the event and resolves the commit to deploy.
# - ci:          the full CI gate (ci.yml via workflow_call) on exactly that commit, for every
#                trigger: no path filter, so Biome, tsc, Vitest, xUnit with Azurite, Bicep lint,
#                hygiene and the Playwright device matrix all run. Every environment needs it to
#                succeed, so a red CI stops the whole deploy; every deploy waits for the device
#                matrix. The workflow files come from main, the code under test from the commit.
# - e2e:         the fictional sample instance (samples/instance).
# - test:        real content from the private instance repo (vars.INSTANCE_REPO, read-only deploy
#                key); runs after e2e succeeded or was not selected.
# - production:  the same instance repo, pinned to the instance commit test deployed in this run;
#                runs after test succeeded or was not selected, and waits for the owner's approval
#                (GitHub Environment `production`). Switched off until there is a customer
#                (ADR 0012): it runs only while the REPOSITORY variable PRODUCTION_ENABLED is
#                'true' (in any letter case). Otherwise the plan drops it with a notice and a
#                summary line, and the job is skipped without naming the environment (naming it
#                would create it again).
# Each environment is a call of _deploy-environment.yml, which skips cleanly while its environment
# has no Azure variables (or no INSTANCE_REPO) and fails on a missing or invalid instance.
# Backups (docs/runbooks/backup-restore.md): test and production export every table to their own
# backup storage account before anything changes (a failed backup stops that deploy, so production
# never runs after a test deploy whose backup failed); e2e runs a restore drill after its deploy,
# so a broken backup or restore path stops the promotion before test. Nightly: backup.yml.
#
# Triggers:
# - push to main:           e2e -> test -> production (production only while it is switched on).
# - repository_dispatch:    type `instance-updated` (the instance repo changed): test -> production.
#                           Optional client_payload.instance_sha pins the instance commit.
# - workflow_dispatch:      run from main. `environment` picks all, one environment or test and
#                           production (what the instance repo's workflow starts, see
#                           docs/runbooks/instance-repo.md); `ref` picks the commit of this repo
#                           (production: only ancestors of origin/main; e2e and test: any commit on
#                           a branch of this repo); `instance-ref` picks the instance commit or
#                           branch (production: only commits on the instance repo's main).
#
# Hygiene (CLAUDE.md): no secrets in logs, hostnames and the deploy token are masked, `-o none` on
# deployments, no environment.url, job summaries show only commit SHAs.
#
# Concurrency (in _deploy-environment.yml): one deploy per environment; a newer run cancels the
# older run's deploy of that environment, whether it is running or waiting for approval
# (cancel-in-progress). Only the newest commit matters, so cancelling is deliberate, with one risk:
# a deploy cancelled during a Bicep step leaves its ARM deployment running in Azure, and the next
# run can fail with DeploymentActive. Recover by re-running the failed job once that ARM deployment
# has finished (`az deployment group list -g <resource group> -o table`, or the Deployments page of
# the resource group in the portal).
# Runs are not ordered by commit: an older run whose ci finishes after a newer run's, or a re-run
# of an older run, replaces the newer deploy. Re-run the newest run to restore it.
name: deploy

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - instance-updated
  workflow_dispatch:
    inputs:
      environment:
        description: Environments to deploy.
        type: choice
        options:
          - all
          - e2e
          - test
          - production
          - test-and-production
        default: all
      ref:
        description: Commit SHA, branch or tag of this repo (default the head of main). Production accepts only commits on main.
        type: string
        default: ""
      instance-ref:
        description: Instance repo commit SHA or branch for test and production (default its main). Production accepts only commits on its main.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      e2e: ${{ steps.plan.outputs.e2e }}
      test: ${{ steps.plan.outputs.test }}
      production: ${{ steps.plan.outputs.production }}
      environments: ${{ steps.plan.outputs.environments }}
      instance-ref: ${{ steps.plan.outputs.instance-ref }}
    steps:
      - name: Check out (commit graph of every branch and tag, no file history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Decide the environments and resolve the commit
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_INSTANCE_REF: ${{ inputs.instance-ref }}
          PAYLOAD_INSTANCE_SHA: ${{ github.event.client_payload.instance_sha }}
          PRODUCTION_ENABLED: ${{ vars.PRODUCTION_ENABLED }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          # The GitHub Environments accept deployments from main only.
          [ "$GITHUB_REF" = refs/heads/main ] ||
            fail "run this workflow from main; pick the commit with the 'ref' input"

          ref=""
          instance_ref=""
          case "$EVENT" in
            push)
              envs="e2e test production"
              ;;
            repository_dispatch)
              envs="test production"
              instance_ref=$PAYLOAD_INSTANCE_SHA
              ;;
            workflow_dispatch)
              case "$INPUT_ENVIRONMENT" in
                all) envs="e2e test production" ;;
                e2e | test | production) envs=$INPUT_ENVIRONMENT ;;
                test-and-production) envs="test production" ;;
                *) fail "unknown environment input" ;;
              esac
              ref=$INPUT_REF
              instance_ref=$INPUT_INSTANCE_REF
              ;;
            *) fail "unsupported event $EVENT" ;;
          esac
          selected() { [[ " $envs " == *" $1 "* ]]; }

          # Production is switched off until there is a customer (ADR 0012): drop it unless the
          # repository variable PRODUCTION_ENABLED is 'true' in any letter case (lower-cased here,
          # because the job's `if` compares with GitHub's case-insensitive ==). Not a failure, so
          # every trigger and dispatch input keeps working; test still deploys.
          production_off=false
          if selected production && [ "${PRODUCTION_ENABLED,,}" != true ]; then
            production_off=true
            kept=""
            for env in $envs; do
              if [ "$env" != production ]; then kept="$kept $env"; fi
            done
            envs=${kept# }
            echo "::notice::production is switched off (repository variable PRODUCTION_ENABLED is not 'true'); it is not deployed."
          fi

          # Instance ref: a full commit SHA or a branch name of the instance repo.
          if [ -n "$instance_ref" ] && ! [[ $instance_ref =~ ^[0-9a-f]{40}$ ]]; then
            if [ "$EVENT" = repository_dispatch ]; then
              fail "client_payload.instance_sha must be a full commit SHA"
            fi
            if ! [[ $instance_ref =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ ]] ||
              ! git check-ref-format --branch "$instance_ref" >/dev/null 2>&1; then
              fail "instance-ref must be a full commit SHA or a branch name of the instance repo"
            fi
          fi
          if [ -n "$instance_ref" ] && ! selected test && ! selected production; then
            echo "::notice::instance-ref is ignored: neither test nor production is deployed."
            instance_ref=""
          fi

          # Commit of this repo: default the commit the event ran on (the head of main).
          if [ -z "$ref" ]; then
            sha=$GITHUB_SHA
          else
            [[ $ref =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]] ||
              fail "ref must be a commit SHA, a branch or a tag of this repository"
            sha=""
            candidates=("refs/remotes/origin/$ref" "refs/tags/$ref")
            if [[ $ref =~ ^[0-9a-f]{7,40}$ ]]; then candidates+=("$ref"); fi
            for candidate in "${candidates[@]}"; do
              if sha=$(git rev-parse --verify --quiet "$candidate^{commit}"); then break; fi
              sha=""
            done
            [ -n "$sha" ] || fail "ref is no commit, branch or tag of this repository"
          fi

          if git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
            on_main=true
          else
            on_main=false
            if selected production; then
              fail "production deploys only commits on main (ancestors of origin/main)"
            fi
            branches=$(git for-each-ref --contains "$sha" --format='%(refname)' refs/remotes/origin |
              grep -cv '/HEAD$' || true)
            [ "$branches" -gt 0 ] || fail "the commit is on no branch of this repository"
            echo "::warning::deploying ${sha:0:7}, which is not on main, to: ${envs:-no environment}"
          fi

          {
            echo "sha=$sha"
            for env in e2e test production; do
              if selected "$env"; then echo "$env=true"; else echo "$env=false"; fi
            done
            echo "environments=$envs"
            echo "instance-ref=$instance_ref"
          } >>"$GITHUB_OUTPUT"
          echo "commit ${sha:0:7} (on main: $on_main) -> ${envs:-no environment}"
          {
            echo "### deploy plan"
            echo "- commit: \`${sha:0:7}\`"
            echo "- environments: ${envs:-none}"
            if [ "$production_off" = true ]; then
              echo "- production: switched off (repository variable PRODUCTION_ENABLED)"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

  ci:
    name: ci
    needs: plan
    # Nothing to deploy (only production was selected while it is switched off): no CI run.
    if: needs.plan.outputs.environments != ''
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}

  e2e:
    name: e2e
    needs:
      - plan
      - ci
    # Implicitly also requires plan and ci to have succeeded.
    if: needs.plan.outputs.e2e == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      environment: e2e
      instance-source: sample
      ref: ${{ needs.plan.outputs.sha }}

  test:
    name: test
    needs:
      - plan
      - ci
      - e2e
    # After ci and e2e succeeded, or when e2e was not selected (never after a failed or skipped e2e).
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.ci.result == 'success'
      && needs.plan.outputs.test == 'true'
      && (needs.e2e.result == 'success' || (needs.e2e.result == 'skipped' && needs.plan.outputs.e2e != 'true')) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      environment: test
      instance-source: repo
      ref: ${{ needs.plan.outputs.sha }}
      instance-ref: ${{ needs.plan.outputs.instance-ref }}
    secrets:
      # The environment secret of `test` takes precedence inside the called job.
      INSTANCE_REPO_DEPLOY_KEY: ${{ secrets.INSTANCE_REPO_DEPLOY_KEY }}

  production:
    name: production
    needs:
      - plan
      - ci
      - e2e
      - test
    # After ci and test succeeded, or when test was not selected; e2e likewise. Then the approval.
    # Only while production is switched on (ADR 0012); the plan already drops it otherwise, and the
    # variable is checked again here so a re-run after switching it off cannot create the environment.
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.ci.result == 'success'
      && needs.plan.outputs.production == 'true' && vars.PRODUCTION_ENABLED == 'true'
      && (needs.e2e.result == 'success' || (needs.e2e.result == 'skipped' && needs.plan.outputs.e2e != 'true'))
      && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.plan.outputs.test != 'true')) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      environment: production
      instance-source: repo
      ref: ${{ needs.plan.outputs.sha }}
      # Exactly the instance commit test deployed in this run; otherwise the requested one or main.
      instance-ref: ${{ needs.test.outputs.instance-sha || needs.plan.outputs.instance-ref }}
    secrets:
      # The environment secret of `production` takes precedence inside the called job.
      INSTANCE_REPO_DEPLOY_KEY: ${{ secrets.INSTANCE_REPO_DEPLOY_KEY }}
