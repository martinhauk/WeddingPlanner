<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Static error page served by Azure Static Web Apps (responseOverrides 404). It may be served
         under any path, so links are absolute; it loads nothing external and runs no script. -->
    <link rel="icon" href="data:," />
    <title>404 · Page not found</title>
    <style>
      :root {
        color-scheme: light;
        background: #faf6ee;
        color: #2f2a26;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100svh;
        margin: 0;
        padding: 1.5rem;
      }
      main {
        max-width: 34rem;
      }
      .status {
        margin: 0;
        color: #6b625a;
        font-size: 0.875rem;
        letter-spacing: 0.1em;
      }
      h1 {
        margin: 0.25rem 0 1rem;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        font-size: 1.75rem;
        font-weight: 500;
        line-height: 1.25;
      }
      ul {
        margin: 1.5rem 0 0;
        padding: 0;
        list-style: none;
      }
      a {
        color: #6e5530;
        font-weight: 600;
      }
      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="status">404</p>
      <h1>
        <span lang="en">Page not found</span> · <span lang="de">Seite nicht gefunden</span> ·
        <span lang="es">Página no encontrada</span>
      </h1>
      <p>This page does not exist, or it has moved.</p>
      <p lang="de">Diese Seite gibt es nicht, oder sie ist umgezogen.</p>
      <p lang="es">Esta página no existe o se ha movido.</p>
      <ul>
        <li>
          <a href="/">
            <span lang="en">Home page</span> · <span lang="de">Startseite</span> ·
            <span lang="es">Página de inicio</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
