# Local storage emulator for the API (ADR 0008). Start with `pnpm storage:up`
# (docker compose up --detach --wait: returns once the healthcheck passes), stop with
# `pnpm storage:down`. Uses the active docker context (Docker Desktop or OrbStack).
#
# The project name is fixed so every worktree addresses the same Azurite; tests isolate
# themselves with random table prefixes. The same image tag runs as the CI service container.
name: weddingplanner

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.38.0
    command:
      - azurite
      - --blobHost
      - 0.0.0.0
      - --queueHost
      - 0.0.0.0
      - --tableHost
      - 0.0.0.0
      - --location
      - /data
    ports:
      - "10000:10000" # blob
      - "10001:10001" # queue
      - "10002:10002" # table
    volumes:
      - ./.azurite:/data
    healthcheck:
      # Healthy once all three endpoints accept TCP connections (node ships with the image).
      test:
        - CMD
        - node
        - -e
        - >-
          const net = require('net');
          Promise.all([10000, 10001, 10002].map((port) => new Promise((resolve, reject) => {
          const socket = net.connect(port, '127.0.0.1', () => { socket.end(); resolve(); });
          socket.on('error', reject); })))
          .then(() => process.exit(0), () => process.exit(1));
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped
